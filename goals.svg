cs project with sensors and a microcontroller</text><rect x="40" y="348" width="20" height="20" rx="4" fill="none" stroke="#39ff14" filter="url(#glow)"/><text x="50" y="363" font-size="12" text-anchor="middle" class="g">8</text><text x="76" y="364" font-size="16" class="t">Contribute to open source and grow in public</text>
