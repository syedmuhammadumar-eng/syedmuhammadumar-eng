<linearGradient id="scang" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39ff14" stop-opacity="0"/><stop offset=".5" stop-color="#39ff14" stop-opacity=".18"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></linearGradient>
